<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إحصائيات الإدارة - SYRIA ID</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: linear-gradient(135deg, #0a0f0d, #121e17, #000000);
            color: #ffffff;
            text-align: center; 
            padding: 40px 15px; 
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        .card { 
            background: rgba(18, 26, 22, 0.95); 
            width: 100%;
            max-width: 650px; 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8); 
            border: 1px solid #2e7d32;
        }
        .server-title {
            color: #2e7d32;
            font-size: 30px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        .managers-box {
            background-color: rgba(0, 0, 0, 0.5);
            border: 1px dashed #2e7d32;
            border-radius: 8px;
            padding: 10px;
            margin: 15px 0 25px 0;
            display: inline-block;
            width: 80%;
        }
        .managers-title { color: #aaa; font-size: 13px; margin-bottom: 5px; }
        .managers-names { color: #ffffff; font-size: 16px; font-weight: bold; letter-spacing: 1px; }
        .managers-names span { color: #28a745; }
        
        input[type="password"], select { 
            padding: 12px; 
            font-size: 15px; 
            text-align: center; 
            border: 1px solid #2e7d32;
            border-radius: 6px;
            background-color: #0a0f0d;
            color: #fff;
            outline: none;
        }
        input[type="password"] { width: 70%; margin-bottom: 15px; }
        select { width: 60%; margin-bottom: 15px; cursor: pointer; }

        button { 
            padding: 12px 25px; 
            background-color: #28a745; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold;
            font-size: 16px;
            transition: 0.2s;
        }
        button:hover { background-color: #218838; }

        table { 
            width: 100%; 
            margin-top: 10px; 
            border-collapse: collapse; 
            background-color: #0a0f0d;
            border-radius: 8px;
            overflow: hidden;
        }
        th, td { border: 1px solid #1e3a29; padding: 12px; text-align: center; }
        th { background-color: #1e3a29; color: #28a745; font-size: 16px; }
        td { color: #ffffff; }
        tr:nth-child(even) { background-color: #121e17; }
    </style>
</head>
<body>

    <div class="card">
        <div class="server-title">SYRIA ID</div>

        <div class="managers-box">
            <div class="managers-title">المسؤولين عن الإدارة</div>
            <div class="managers-names"><span>ANAS</span> & <span>BALOUSH</span></div>
        </div>

        <div id="authBox">
            <p style="color: #ccc;">أدخل كلمة المرور لعرض الإحصائيات:</p>
            <input type="password" id="passInput" placeholder="كلمة المرور">
            <br>
            <button onclick="checkPass()">دخول</button>
        </div>

        <div id="statsBox" style="display: none;">
            <h3 style="color: #ffffff; margin-bottom: 10px;">جدول إحصائيات الإداريين</h3>
            
            <label style="color: #aaa; display: block; margin-bottom: 5px;">اختر الأسبوع:</label>
            <select id="weekSelect" onchange="loadStats()">
                <option value="">جميع الأسابيع (شامل)</option>
            </select>

            <table>
                <thead>
                    <tr>
                        <th>الاسم</th>
                        <th>عدد الشفتات</th>
                        <th>إجمالي الوقت</th>
                    </tr>
                </thead>
                <tbody id="statsTable"></tbody>
            </table>
        </div>
    </div>

    <script>
        const SECRET_PASS = "123456"; 

        function checkPass() {
            const pass = document.getElementById('passInput').value;
            if (pass === SECRET_PASS) {
                document.getElementById('authBox').style.display = 'none';
                document.getElementById('statsBox').style.display = 'block';
                loadStats();
            } else {
                alert('كلمة المرور غير صحيحة!');
            }
        }

        async function loadStats() {
            const selectedWeek = document.getElementById('weekSelect').value;
            const res = await fetch(`/api/stats?week=${selectedWeek}`);
            const data = await res.json();
            
            const select = document.getElementById('weekSelect');
            if (select.children.length <= 1 && data.weeks) {
                select.innerHTML = '<option value="">جميع الأسابيع (شامل)</option>';
                data.weeks.forEach(w => {
                    const [year, weekNum] = w.week_code.split('-');
                    select.innerHTML += `<option value="${w.week_code}">الأسبوع رقم ${weekNum} لعام ${year}</option>`;
                });
                select.value = selectedWeek;
            }

            const tbody = document.getElementById('statsTable');
            tbody.innerHTML = '';

            if (!data.stats || data.stats.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3">لا توجد بيانات سجلت بعد</td></tr>';
                return;
            }

            data.stats.forEach(item => {
                const hours = (item.total_minutes / 60).toFixed(2);
                tbody.innerHTML += `
                    <tr>
                        <td>${item.admin_name}</td>
                        <td>${item.total_shifts}</td>
                        <td>${hours} ساعة (${item.total_minutes} دقيقة)</td>
                    </tr>
                `;
            });
        }
    </script>
</body>
</html>
