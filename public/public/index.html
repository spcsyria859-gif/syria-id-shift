<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الشفتات - SYRIA ID</title>
    <style>
        .server-logo {
    width: 100px; /* التعديل على حجم اللوجو حسب الرغبة */
    height: 100px;
    border-radius: 50%; /* يجعله دائرياً */
    object-fit: cover;
    margin-bottom: 15px;
    box-shadow: 0 0 20px rgba(46, 125, 50, 0.6); /* توهج أخضر حول اللوجو */
    border: 2px solid #2e7d32;
}
        body { 
            font-family: Arial, sans-serif; 
            background: linear-gradient(135deg, #0a0f0d, #121e17, #000000);
            color: #ffffff;
            text-align: center; 
            padding: 40px 20px; 
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column; /* ترتيب العناصر عمودياً */
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        .welcome-title {
            color: #ffffff;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(46, 125, 50, 0.6);
        }
        .card { 
            background: rgba(18, 26, 22, 0.95); 
            width: 100%;
            max-width: 450px; 
            padding: 40px 30px; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8); 
            border: 1px solid #2e7d32;
            box-sizing: border-box;
        }
        .server-title {
            color: #2e7d32;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        .discord-btn {
            background-color: #5865F2;
            color: white;
            padding: 12px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
            transition: 0.2s;
        }
        .discord-btn:hover { background-color: #4752C4; }
        .user-profile {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .user-profile img { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #28a745; }
        
        input[type="text"] { 
            width: 85%; 
            padding: 12px; 
            margin-bottom: 20px; 
            font-size: 16px; 
            text-align: center; 
            border: 1px solid #2e7d32;
            border-radius: 6px;
            background-color: #0a0f0d;
            color: #fff;
            outline: none;
            box-sizing: border-box;
        }
        button { 
            width: 85%; 
            padding: 12px; 
            font-size: 16px; 
            font-weight: bold;
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            transition: 0.2s;
        }
        .btn-login { background-color: #28a745; color: white; }
        .btn-login:hover { background-color: #218838; }
        .btn-logout { background-color: #dc3545; color: white; }
        .btn-logout:hover { background-color: #c82333; }
        #statusMessage { margin-top: 20px; font-weight: bold; color: #81c784; }
    </style>
</head>
<body>
 <img src="logo.png" alt="Server Logo" class="server-logo">
    <h1 class="welcome-title">مرحباً بك بنظام مراقبة الطاقم الإداري</h1>

    <div class="card">
        <div class="server-title">SYRIA ID</div>
        <h3 style="margin-bottom: 20px;">تسجيل الدخول / الخروج للإدارة</h3>

        <div id="discordAuthArea">
            <a href="/auth/discord" class="discord-btn">ربط بحساب الديسكورد 🔗</a>
        </div>

        <div id="userInfo" class="user-profile" style="display: none;">
            <img id="userAvatar" src="" alt="Avatar">
            <span id="userName" style="font-weight: bold; color: #28a745;"></span>
        </div>

        <input type="text" id="adminName" placeholder="أدخل اسم الإداري">
        <br>
        <button id="actionBtn" class="btn-login" onclick="handleShift()">بدء الشفت (تسجيل دخول)</button>

        <p id="statusMessage"></p>
    </div>

    <script>
        let currentShiftId = localStorage.getItem('shiftId');
        let loggedInDiscordUser = null;

        async function checkDiscordUser() {
            try {
                const res = await fetch('/api/user');
                const data = await res.json();
                if (data.authenticated) {
                    loggedInDiscordUser = data.username;
                    document.getElementById('discordAuthArea').style.display = 'none';
                    document.getElementById('userInfo').style.display = 'flex';
                    document.getElementById('userName').innerText = data.username;
                    document.getElementById('userAvatar').src = data.avatar;
                    
                    const adminInput = document.getElementById('adminName');
                    adminInput.value = data.username;
                    adminInput.disabled = true;
                }
            } catch (err) {
                console.error("خطأ في التحقق:", err);
            }
            updateUI();
        }

        function updateUI() {
            const btn = document.getElementById('actionBtn');
            if (currentShiftId) {
                btn.innerText = 'إنهاء الشفت (تسجيل خروج)';
                btn.className = 'btn-logout';
            } else {
                btn.innerText = 'بدء الشفت (تسجيل دخول)';
                btn.className = 'btn-login';
            }
        }

        async function handleShift() {
            const adminInput = document.getElementById('adminName');
            const adminName = loggedInDiscordUser || adminInput.value.trim();
            const msg = document.getElementById('statusMessage');

            if (!adminName) {
                alert('يرجى أدخل اسم الإداري أولاً');
                return;
            }

            try {
                if (!currentShiftId) {
                    const res = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ adminName: adminName })
                    });
                    
                    const data = await res.json();

                    if (res.ok && data.shiftId) {
                        currentShiftId = data.shiftId;
                        localStorage.setItem('shiftId', currentShiftId);
                        msg.innerText = `🟢 تم بدء الشفت للإداري: ${data.adminName}`;
                    } else {
                        alert(data.error || 'حدث خطأ أثناء بدء الشفت');
                    }
                } else {
                    const res = await fetch('/api/logout', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ shiftId: currentShiftId })
                    });
                    
                    const data = await res.json();

                    if (res.ok) {
                        localStorage.removeItem('shiftId');
                        currentShiftId = null;
                        msg.innerText = `🔴 تم إنهاء الشفت. المدة: ${data.durationMinutes} دقيقة.`;
                    }
                }
            } catch (err) {
                console.error(err);
                alert('تعذر الاتصال بالسيرفر! تأكد من تشغيل node server.js');
            }

            updateUI();
        }

        checkDiscordUser();
    </script>
</body>
</html>
